name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          APP_DIR="../lowback/$REPO_NAME"
          REPO_URL="git@github.com:LowBackk/$REPO_NAME.git"

          ssh -T github-action@195.35.48.166 << EOF
            # Check if the application directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "Application directory does not exist. Setting up for the first time..."
              echo "Cloning repository with URL: $REPO_URL"
              GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_service_mail -o StrictHostKeyChecking=no" git clone $REPO_URL $APP_DIR
            fi

            # Navigate to the app directory and update
            cd $APP_DIR
            git stash
            git clean -fd
            GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_service_mail -o StrictHostKeyChecking=no" git pull
            sudo systemctl restart $REPO_NAME.service
          EOF
